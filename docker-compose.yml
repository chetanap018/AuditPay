services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: auditpay-backend
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      DATABASE_URL: "sqlite:////data/auditpay.db"
      # Credentials are never baked into the image. Copy .env.example to .env and
      # set RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET there; compose fails fast with a
      # clear message if they are missing instead of silently falling back to a
      # hardcoded test key.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?RAZORPAY_KEY_ID missing — cp .env.example .env and set it}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?RAZORPAY_KEY_SECRET missing — cp .env.example .env and set it}
    volumes:
      - auditpay_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: auditpay-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: "http://localhost:8000/api"
    restart: unless-stopped

volumes:
  auditpay_data:
